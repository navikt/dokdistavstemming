# Spring Boot
logging.config=classpath:logback-nais.xml
spring.jmx.enabled=false
spring.main.banner_mode=off

# tomcat
server.tomcat.threads.min-spare=2
server.tomcat.threads.max=2

application.name=dokdistavstemming
application.version=@application.version@

# actuators
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.endpoints.web.exposure.include=prometheus
management.metrics.enable.http.client.requests=false

# Kl. 08 hver mandag, tirsdag, onsdag, torsdag og fredag
scheduler_jira_cron=00 00 11 * * 1,2,3,4,5

server.error.whitelabel.enabled=false