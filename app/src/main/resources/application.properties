# Spring Boot
logging.config=classpath:logback-nais.xml
spring.jmx.enabled=false
spring.main.banner_mode=off

# tomcat
server.tomcat.threads.min-spare=2
server.tomcat.threads.max=2

# actuators
management.endpoints.web.exposure.include=prometheus,health
# actuator - health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=always
management.endpoint.health.show-details=always
management.endpoint.health.group.liveness.include=jms
# actuator - metrics
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.enable.http.client.requests=false

# Kl. 11 hver mandag, tirsdag, onsdag, torsdag og fredag
scheduler_jira_cron=00 30 11 * * 1,2,3,4,5

scheduler_sdist004_cron =00 30 11 * * 1,2,3,4,5

server.error.whitelabel.enabled=false