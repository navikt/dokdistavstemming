image: "repo.adeo.no:5443/dok/dokdistavstemming"
replicas:
  min: 1
  max: 2
  cpuThresholdPercentage: 50
port: 8080
team: teamdokumenthandtering
healthcheck:
  liveness:
    path: /internal/isAlive
    initialDelay: 30
    failureThreshold: 10
  readiness:
    path: /internal/isReady
    initialDelay: 30
    timeout: 3
prometheus:
  enabled: true
  path: /actuator/prometheus
resources:
  limits:
    cpu: 2000m
    memory: 2048Mi
  requests:
    memory: 512Mi
fasitResources:
  used:
  - alias: srvdokdistavstemming
    resourceType: credential
    propertyMap:
      username: SERVICEUSER_USERNAME
      password: SERVICEUSER_PASSWORD
  - alias: administrerforsendelse_v1
    resourceType: restservice
  - alias: securityTokenService
    resourceType: baseurl
  - alias: security-token-service-token
    resourceType: restservice
  - alias: jira.host
    resourceType: baseurl
    propertyMap:
      url: jira.host
  - alias: srvJiraDokDistAvstemming
      resourceType: credential
      propertyMap:
        username: jira.username
        password: jira.password
  - alias: dokdisavstemming-oidc
    resourceType: openIdConnect
    propertyMap:
      agentName: freg.security.oidc.idp.openAm.clientId
      password: freg.security.oidc.idp.openAm.clientSecret
      hostUrl: freg.security.oidc.idp.openAm.hostUrl
      issuerUrl: freg.security.oidc.idp.openAm.issuerUrl
      jwksUrl: freg.security.oidc.idp.openAm.jwksUrl